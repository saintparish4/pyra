<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Pyra is a free, open-source, self-hostable records management system for US fire departments. NERIS-compliant reporting, one-click export of everything, co-op governed."
    />

    <!--
      Linked rather than @import-ed: an @import inside the stylesheet blocks
      rendering until the font CSS resolves. Archivo carries display and UI;
      IBM Plex Mono carries every incident code, status, and number.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <title>Pyra — Own your records forever</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
